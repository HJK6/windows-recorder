<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:*; style-src 'self' 'unsafe-inline'">
  <title>HF Recorder Demo Console</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #173755, #07131f 60%); color: #edf7ff; }
    main { width: min(900px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0; }
    .eyebrow { color: #6ed6ff; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(36px, 6vw, 64px); letter-spacing: -.04em; }
    .lede { margin: 0 0 32px; color: #a9bfd0; font-size: 18px; }
    .panel { border: 1px solid #2a4962; border-radius: 20px; background: rgba(8, 25, 39, .86); box-shadow: 0 24px 80px #0008; padding: 28px; }
    .status-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 28px; }
    .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; background: #132d42; padding: 9px 13px; color: #c9ddeb; font-weight: 650; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #8293a1; }
    .connected .dot { background: #59e39b; box-shadow: 0 0 16px #59e39b; }
    .recording .dot { background: #ff5f68; box-shadow: 0 0 16px #ff5f68; }
    .paused .dot { background: #ffc857; box-shadow: 0 0 16px #ffc857; }
    .controls { display: grid; grid-template-columns: repeat(3, minmax(130px, 1fr)); gap: 12px; }
    button { border: 1px solid #375771; border-radius: 12px; background: #14334c; color: #f5fbff; padding: 15px 18px; font: inherit; font-weight: 750; cursor: pointer; transition: transform .12s, background .12s; }
    button:hover:not(:disabled) { transform: translateY(-1px); background: #1b496c; }
    button:disabled { cursor: not-allowed; opacity: .38; }
    button.primary { border-color: #41b8e8; background: #087daf; }
    button.danger { border-color: #bd4d56; background: #7b2630; }
    .activity { margin-top: 24px; border-top: 1px solid #27455c; padding-top: 20px; }
    .activity h2 { margin: 0 0 8px; font-size: 14px; color: #7fcfee; text-transform: uppercase; letter-spacing: .09em; }
    #message { margin: 0; min-height: 24px; color: #bed0dc; }
    @media (max-width: 650px) { .controls { grid-template-columns: repeat(2, 1fr); } main { padding: 32px 0; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Health First · Local demonstration</div>
    <h1>Recorder Control</h1>
    <p class="lede">Browser-to-desktop recording over a loopback-only control channel.</p>
    <section class="panel">
      <div class="status-row">
        <span id="connection" class="pill"><span class="dot"></span><span>Connecting</span></span>
        <span id="recorder" class="pill"><span class="dot"></span><span>Waiting for recorder</span></span>
        <span id="microphone" class="pill">Microphone ready</span>
      </div>
      <div class="controls">
        <button id="start" class="primary">● Record</button>
        <button id="pause">❚❚ Pause</button>
        <button id="resume">▶ Resume</button>
        <button id="mute">Mute</button>
        <button id="unmute">Unmute</button>
        <button id="stop" class="danger">■ Stop</button>
      </div>
      <div class="activity">
        <h2>Activity</h2>
        <p id="message">Checking the recorder…</p>
        <button id="retry" hidden>Retry connection</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
